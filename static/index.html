<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On My List</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f1;
    --tile: #ffffff;
    --text: #1c1c1a;
    --muted: #7a7a74;
    --border: #deded8;
    --accent: #d1453b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1a;
      --tile: #272725;
      --text: #ecece6;
      --muted: #8e8e86;
      --border: #3a3a37;
      --accent: #e8695f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, sans-serif;
  }
  h1 {
  color: inherit;
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  }
  input {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #list { list-style: none; margin: 16px 0 0; padding: 0; }
  .tile {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin: 0 0 4px calc(var(--indent, 0) * 24px);
    padding: 4px 14px;
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: grab;
  }
  .tile.dragging { opacity: 0.4; }
  .tile.editing { cursor: auto; padding: 0; border-color: transparent; }
  .tile input { padding: 3px 13px; }
  .tile.category .text { color: var(--accent); font-weight: 700; }
  .tile .text { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .tile .delete {
    flex: none;
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    line-height: 1.4;
    padding: 0 4px;
    cursor: pointer;
    opacity: 0;
  }
  .tile:hover .delete, .tile .delete:focus { opacity: 1; }
  .tile .delete:hover { color: var(--accent); }
  /* A touch screen has no pointer to hold above a tile. */
  @media (hover: none) {
    .tile .delete { opacity: 1; }
  }
  #usage { margin-top: 16px; color: var(--muted); font-size: 13px; }
  #motto { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  #toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: none;
  }
  #toast.show { display: block; }
</style>
</head>
<body>
  <h1>My List</h1>
  <form id="add">
    <input id="new" type="text" placeholder="Add an entry, then press Enter" autocomplete="off" autofocus>
  </form>
  <ul id="list"></ul>
  <div id="usage"></div>
  <p id="motto">No pressure. It’s written down now, so you can stop carrying it. The joy is in the ordinary moments. Go be in one.</p>
  <div id="toast" role="alert"></div>

<script>
  const list = document.getElementById('list');
  const usage = document.getElementById('usage');
  const toast = document.getElementById('toast');
  const addForm = document.getElementById('add');
  const newInput = document.getElementById('new');
  let toastTimer;

  function showError(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // Each change returns the full list. On failure, reload to drop local changes.
  async function change(method, url, body) {
    try {
      render(await api(method, url, body));
      return true;
    } catch (err) {
      showError(err.message);
      load();
      return false;
    }
  }

  async function load() {
    try {
      render(await api('GET', '/api/items'));
    } catch (err) {
      showError(err.message);
    }
  }

  const kB = (bytes) => (bytes / 1000).toFixed(1) + ' kB';

  function render(state) {
    list.replaceChildren(...state.items.map(tile));
    layout();
    const categories = state.items.filter((item) => parse(item.text).depth).length;
    const notes = state.items.length - categories;
    const noteWord = notes === 1 ? 'note' : 'notes';
    const categoryWord = categories === 1 ? 'category' : 'categories';
    usage.textContent = `${notes} ${noteWord} in ${categories} ${categoryWord} - ${kB(state.bytes)} of ${kB(state.maxBytes)} used`;
  }

  // A category starts with one or more ">" marks: "> Work", "> > Projects".
  // The number of marks is the depth. The marks are not shown.
  function parse(text) {
    const m = /^(>(?: ?>)*) +(\S.*)$/.exec(text);
    return m ? { depth: m[1].replace(/ /g, '').length, name: m[2] } : { depth: 0, name: text };
  }

  // An entry belongs to the nearest category above it. The indent comes from
  // the order of the tiles only. A category can be one level deeper than the
  // category above it, not more.
  function layout() {
    let level = 0;
    for (const li of list.children) {
      const depth = Number(li.dataset.depth);
      if (depth) {
        level = Math.min(depth, level + 1);
        li.dataset.level = level;
      }
      li.style.setProperty('--indent', depth ? level - 1 : level);
    }
  }

  function tile(item) {
    const { depth, name } = parse(item.text);
    const li = document.createElement('li');
    li.className = depth ? 'tile category' : 'tile';
    li.draggable = true;
    li.dataset.id = item.id;
    li.dataset.depth = depth;

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = name;

    const del = document.createElement('button');
    del.className = 'delete';
    del.type = 'button';
    del.title = 'Delete';
    del.textContent = '✕';
    del.addEventListener('click', () => {
      if (confirm(`Delete "${name}"?`)) change('DELETE', '/api/items/' + item.id);
    });

    li.append(text, del);
    // A drag does not cause a click, so a click on the text is safe for edit.
    text.addEventListener('click', () => edit(li, item));
    li.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      edit(li, item);
    });
    return li;
  }

  function edit(li, item) {
    if (li.classList.contains('editing')) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = item.text;
    li.classList.add('editing');
    li.draggable = false;
    li.replaceChildren(input);
    input.focus();
    input.select();

    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      const value = input.value.trim();
      if (save && value && value !== item.text) {
        change('PUT', '/api/items/' + item.id, { text: value });
      } else {
        li.replaceWith(tile(item));
        layout();
      }
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = newInput.value.trim();
    if (!text) return;
    if (await change('POST', '/api/items', { text })) newInput.value = '';
  });

  // Drag to reorder: the dragged tiles move in the DOM, then the order is saved.
  // A category moves together with all that is in it.
  const order = () => [...list.children].map((li) => li.dataset.id);
  const isCategory = (li) => li.classList.contains('category');
  let dragged = null;
  let group = [];
  let orderBefore = '';

  list.addEventListener('dragstart', (e) => {
    dragged = e.target.closest('.tile');
    group = [dragged];
    if (isCategory(dragged)) {
      const level = Number(dragged.dataset.level);
      for (let li = dragged.nextElementSibling; li; li = li.nextElementSibling) {
        if (isCategory(li) && Number(li.dataset.level) <= level) break;
        group.push(li);
      }
    }
    orderBefore = order().join();
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragged.dataset.id);
    setTimeout(() => group.forEach((li) => li.classList.add('dragging')));
  });

  list.addEventListener('dragover', (e) => {
    if (!dragged) return;
    e.preventDefault();
    // An entry that is over a category goes into it, except at the top edge.
    const next = [...list.children].filter((li) => !group.includes(li)).find((li) => {
      const box = li.getBoundingClientRect();
      const part = isCategory(li) && !isCategory(dragged) ? 0.25 : 0.5;
      return e.clientY < box.top + box.height * part;
    });
    if (next !== group[group.length - 1].nextElementSibling) {
      for (const li of group) list.insertBefore(li, next || null);
      layout();
    }
  });

  list.addEventListener('drop', (e) => e.preventDefault());

  list.addEventListener('dragend', () => {
    if (!dragged) return;
    group.forEach((li) => li.classList.remove('dragging'));
    dragged = null;
    group = [];
    if (order().join() !== orderBefore) change('PUT', '/api/order', { ids: order() });
  });

  load();
</script>
</body>
</html>
